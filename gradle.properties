android.useAndroidX=true
android.nonTransitiveRClass=true
# Batch 40: heap dinaikkan (2048m->4096m) — kapt (Hilt annotation processing) +
# Compose compiler plugin butuh heap lebih besar biar gak GC-thrashing di CI
# (runner ubuntu-latest 7GB RAM, 4GB buat Gradle daemon masih aman).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.code.style=official
# Batch 40 — kumpulan flag pemangkas waktu compile (CI, project 1-modul):
# - parallel: task antar-project jalan paralel (manfaat kecil sekarang krn cuma
#   :app, tapi gratis & gak ada downside, siap kalau modul nambah).
# - caching: Gradle Build Cache lokal AKTIF — task kapt/compileKotlin yang
#   input-nya gak berubah antar-run di-restore dari cache, bukan dieksekusi ulang.
#   Cache dir-nya di-persist antar-run CI oleh gradle/actions/setup-gradle di
#   workflow (lihat build.yml) — inilah win terbesar buat "update kecil, build
#   cepat".
# - configureondemand: skip evaluasi config project yang gak relevan ke task
#   yang diminta (manfaat kecil di 1-modul, tapi harmless).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
# kapt (Hilt) adalah bagian PALING LAMBAT dari build project ini (generate stub
# Java + annotation processing). 3 flag ini official Kotlin/kapt buat mempercepat:
# incremental.apt = kapt cuma proses ulang file yang berubah (bukan semua file
# tiap build), use.worker.api = kapt jalan di Gradle Worker terisolasi (lebih
# baik paralelisasi & memory management), include.compile.classpath=false =
# kapt gak perlu re-scan seluruh classpath compile tiap kali (AGP 3.6+ sudah gak
# butuh ini, mempercepat & mengurangi risiko stale-classpath).
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false
