android.useAndroidX=true
android.nonTransitiveRClass=true
# Batch 40: dinaikkan dari 2048m -> 3072m (runner GitHub Actions ubuntu-latest
# punya RAM 7GB, ada headroom aman buat daemon Gradle+Kotlin+kapt+D8/R8 jalan
# bareng tanpa OOM) — heap kekecilan bikin GC lebih sering jalan, compile jadi
# lebih lambat, terutama pas kapt (Hilt) generate stubs.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
kotlin.code.style=official
# Batch 40 — dua baris di bawah ini pemangkasan waktu compile CI paling murah
# (cuma nyalain flag bawaan Gradle, TANPA ubah dependency/kode apapun):
# - org.gradle.parallel: task dari MODULE independen dieksekusi paralel (project
#   ini cuma 1 module ':app' jadi manfaatnya kecil SEKARANG, tapi gratis dan siap
#   kalau nanti pecah jadi multi-module — tetap dinyalakan, gak ada downside).
# - org.gradle.caching: build cache LOKAL (di dalam runner yang sama) — kalau ada
#   task yang input-nya PERSIS sama antara assembleDebug & assembleRelease
#   (dijalankan berurutan di 1 job yang sama, lihat build.yml), Gradle skip
#   re-run task itu dan reuse output sebelumnya.
org.gradle.parallel=true
org.gradle.caching=true
# Batch 49: kapt (Hilt) DICABUT TOTAL dari project ini (lihat app/build.gradle.kts +
# CHANGELOG.md v1.86.0) — 2 baris `kapt.use.worker.api`/`kapt.incremental.apt` (Batch
# 41) DIHAPUS karena flag buat plugin yang sudah gak dipasang lagi (dead config, bukan
# error kalau dibiarkan, tapi membingungkan buat sesi depan).
# `org.gradle.configuration-cache` SENGAJA BELUM dinyalakan di batch yang SAMA dengan
# pencabutan kapt ini, MESKI alasan penahanannya (Batch 40: "kapt kurang mulus
# dikombinasi configuration cache") sudah hilang bareng kapt — draf awal batch ini
# sempat nyalain keduanya sekaligus, TAPI itu numpuk 2 perubahan besar tanpa compiler
# buat verifikasi ganda resikonya dalam 1 push yang sama (confidence gabungan turun di
# bawah ambang aman). Dipisah sengaja: kapt removal ini divalidasi CI dulu (kandidat
# TERBESAR percepatan compile, confidence tinggi — mekanismenya AndroidX baku, bukan
# reka-reka), BARU configuration-cache jadi kandidat kuat batch build-speed BERIKUTNYA
# begitu run ini CI CONFIRMED hijau.
# Batch 50: user KONFIRMASI CI v1.86.0 (Batch 49, cabut Hilt/kapt) HIJAU/SUKSES —
# syarat penahanan di atas sudah terpenuhi. `org.gradle.configuration-cache=true`
# SEKARANG dinyalakan sebagai variabel risiko TUNGGAL batch ini (kapt removal sudah
# tervalidasi CI run terpisah sebelumnya, bukan digabung dalam 1 push yang sama lagi).
# Manfaat: Gradle skip SELURUH fase konfigurasi (evaluasi build.gradle.kts, resolusi
# plugin/task graph) di run kedua+ selama input konfigurasi tidak berubah — cache-nya
# tersimpan di `~/.gradle/caches` yang SUDAH di-cache lintas-run oleh `cache: 'gradle'`
# (actions/setup-java, Batch 40), jadi manfaatnya otomatis kepakai mulai run berikutnya
# tanpa perubahan CI lain. KALAU CI merah setelah ini: error biasanya eksplisit sebut
# "configuration cache problems" (bukan error compile Kotlin biasa) — kandidat pertama
# yang dicurigai: task custom apapun yang baca System.getenv()/file di luar declared
# input saat execution (project ini baca KEYSTORE_PATH dkk via System.getenv() di
# signingConfigs — sudah dicek: itu dibaca saat KONFIGURASI, bukan saat task EXECUTION,
# jadi seharusnya aman, tapi belum tervalidasi compiler).
org.gradle.configuration-cache=true

