name: Build AudioEnhancerPro Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Batch 40: debug+release DIGABUNG jadi 1 job (sebelumnya 2 job terpisah,
# `release: needs: build`) — kenapa ini pemangkasan waktu paling besar:
# 1. 2 job = 2 runner VM terpisah, masing-masing checkout+setup-JDK+bootstrap
#    wrapper dari NOL (~30-60 detik overhead murni, dikali 2).
# 2. Gradle daemon & local build cache (poin 3 di bawah) HIDUP SELAMA 1 JOB —
#    assembleRelease di job terpisah gak bisa manfaatin daemon warm/task-output
#    cache dari assembleDebug barusan karena beda VM sama sekali. Digabung 1 job
#    -> assembleRelease start dengan JVM/Kotlin-daemon udah panas.
# Semantik TIDAK berubah: `needs: build` sebelumnya bikin job release otomatis
# ke-skip kalau job build gagal — sekarang persis sama (step berkondisi biasa,
# bukan `if: always()`, otomatis ke-skip kalau step sebelumnya gagal, standar
# GitHub Actions).
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Batch 11: WAJIB buat publish GitHub Release (bukan cuma Actions Artifact).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Batch 65 (FEATURE LOCKS #3, mandatory, sebelumnya HILANG total dari workflow
      # ini — pelanggaran nyata, bukan asumsi): "Stale Run Guard" — cegah run yang
      # sudah usang (commit main sudah maju lagi sebelum run ini sempat publish)
      # tetap lanjut nge-release APK utk commit yang bukan HEAD main lagi. Kasus
      # nyata yang dicegah: 2 push Termux beruntun cepat -> 2 run CI paralel/
      # overlap -> run PERTAMA (SHA lama) masih jalan lambat, run KEDUA (SHA baru)
      # selesai duluan & publish duluan -> run PERTAMA lanjut & overwrite/nambah
      # Release baru pakai kode LAMA yang sudah ketinggalan. `git ls-remote` dipilih
      # (bukan `git rev-parse origin/main`) karena checkout default SHALLOW +
      # single-branch, remote-tracking ref `origin/main` belum tentu ke-fetch penuh
      # — `ls-remote` query LANGSUNG ke server, gak butuh riwayat lokal apapun.
      # Ditaruh PALING AWAL (sebelum step apapun lain yang makan waktu/resource)
      # biar run stale exit SECEPAT mungkin, gak buang menit CI build penuh.
      - name: Stale Run Guard
        run: |
          REMOTE_MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -z "$REMOTE_MAIN_SHA" ]; then
            echo "::warning::Tidak bisa ambil SHA remote main (network/repo issue?) — guard dilewati, lanjut build."
          elif [ "$GITHUB_SHA" != "$REMOTE_MAIN_SHA" ]; then
            echo "::error::Stale run terdeteksi — GITHUB_SHA ($GITHUB_SHA) sudah bukan HEAD main lagi (HEAD sekarang: $REMOTE_MAIN_SHA). Run ini dibatalkan supaya tidak publish Release untuk commit yang sudah usang."
            exit 1
          else
            echo "OK — GITHUB_SHA sama dengan HEAD main ($GITHUB_SHA)."
          fi

      # v1.59 fix: dipindah ke PALING AWAL (sebelum step apapun yang bisa gagal) —
      # dibutuhkan buat penamaan artifact log kegagalan & nama rilis, jadi harus
      # selalu ada nilainya sedini mungkin. Cuma `grep` ke file teks, gak butuh
      # gradlew/JDK sama sekali, aman dijalankan paling depan.
      # Batch 76: versionName di app/build.gradle.kts SEKARANG formula
      # (`System.getenv("GITHUB_RUN_NUMBER") ?: "1"`), BUKAN literal string lagi —
      # `grep` lama ke gradle file gak bakal nemu apa-apa (selalu jatuh ke fallback
      # "0.0", SALAH). `github.run_number` context var GitHub Actions SUDAH PERSIS
      # nilai yang sama, dipakai langsung, 0 parsing gradle dibutuhkan lagi.
      - name: Extract version name
        id: version
        run: |
          VERSION="${{ github.run_number }}"
          echo "Terdeteksi versionName: $VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      # Batch 40: tambah `cache: 'gradle'` — bawaan actions/setup-java, cache
      # ~/.gradle/caches (SEMUA dependency Maven yang di-resolve: AndroxX, Compose,
      # Hilt, Kotlin stdlib, dll) + ~/.gradle/wrapper/dists (distribusi Gradle 8.7
      # itu sendiri, ~120MB, yang sebelumnya didownload ULANG SETIAP RUN karena
      # gradlew di-generate on-the-fly dan gak pernah di-commit ke repo — lihat
      # step "Bootstrap Gradle Wrapper" di bawah). Key cache di-hash dari isi
      # build.gradle.kts/settings.gradle.kts/gradle.properties yang ADA di repo —
      # cache otomatis invalidate sendiri kalau dependency berubah. Run PERTAMA
      # setelah workflow ini tetap full-download (gak ada cache lama buat
      # dipakai), tapi run KEDUA dst jauh lebih cepat.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # v1.60 fix: generate wrapper di direktori kosong terpisah (Gradle 9.6.1
      # sistem WAJIB direktori target udah "valid Gradle project", makanya ada
      # settings.gradle.kts kosong di scratch dir) — dengan cara ini Gradle sistem
      # 9.6.1 SAMA SEKALI TIDAK PERNAH menyentuh build.gradle.kts project ini.
      - name: Bootstrap Gradle Wrapper (isolated dir)
        run: |
          set -o pipefail
          {
            if [ ! -f gradlew ]; then
              BOOTSTRAP_DIR=$(mktemp -d)
              echo "// scratch, cuma buat bootstrap wrapper generik" > "$BOOTSTRAP_DIR/settings.gradle.kts"
              ( cd "$BOOTSTRAP_DIR" && gradle wrapper --gradle-version 8.7 )
              cp "$BOOTSTRAP_DIR/gradlew" .
              cp "$BOOTSTRAP_DIR/gradlew.bat" .
              mkdir -p gradle/wrapper
              cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
              cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
              rm -rf "$BOOTSTRAP_DIR"
            fi
            chmod +x gradlew
          } 2>&1 | tee gradle-wrapper-bootstrap.log

      # Job ini SELALU jalan dan tidak butuh secret apapun — build debug murni buat
      # verifikasi cepat kalau kode-nya kompilasi dengan benar, independen dari
      # status keystore secrets. Output di-tee ke file buat diupload sebagai
      # artifact kalau gagal.
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build-debug.log

      # Diminta user: artifact 'log_fail_v*' biar gampang diunduh langsung kalau CI
      # gagal, tanpa perlu buka & scroll log mentah di tab Actions.
      - name: Upload failure log (debug build)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log_fail_v${{ steps.version.outputs.name }}-debug-run${{ github.run_number }}
          path: |
            gradle-wrapper-bootstrap.log
            gradle-build-debug.log
            **/build/reports/**
          retention-days: 14
          if-no-files-found: warn

      # Dari sini setara job "release" lama — CUMA jalan kalau KEYSTORE_BASE64 dkk
      # sudah diset di GitHub Secrets. Kalau belum, step-step ini di-skip (bukan
      # gagal). Kalau "Build debug APK" di atas gagal, SEMUA step berikut ini
      # otomatis ke-skip juga (perilaku standar GitHub Actions: job berstatus
      # failing, step tanpa `if: failure()`/`if: always()` otomatis dilewati) —
      # persis sama seperti sebelumnya waktu masih `needs: build` antar-job.
      - name: Check keystore secret availability
        id: secret_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Salah satu/lebih dari 4 secrets keystore (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) belum diset lengkap di GitHub Secrets — sisa step release di-skip (bukan gagal). Jalankan Kotak Perintah B (setup awal) untuk set keempat secrets sekaligus."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore from secret
        if: steps.secret_check.outputs.has_secret == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      # Batch 40: daemon Gradle/Kotlin dari step "Build debug APK" di atas masih
      # panas (1 job = 1 VM = 1 daemon yang bisa dipakai ulang), jadi step ini
      # start lebih cepat dibanding dulu (job terpisah = daemon dingin dari nol).
      # Batch 55: `id: build_release` ditambah — dipakai step upload log di bawah
      # buat bedain "step ini beneran gagal" vs "step ini di-skip karena debug
      # gagal duluan" (lihat rasional lengkap di step upload).
      - name: Build signed release APK
        id: build_release
        if: steps.secret_check.outputs.has_secret == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-build-release.log

      # Batch 55 (dilaporkan user, run105): SEBELUMNYA `if: failure()` polos —
      # dievaluasi di level JOB, bukan step ini spesifik. Kalau "Build debug APK"
      # gagal duluan, step "Build signed release APK" di atas ke-SKIP (bukan
      # gagal, lihat komentar "Check keystore secret availability"), TAPI job
      # tetap berstatus failing -> `if: failure()` polos di sini tetap `true` ->
      # step ini TETAP jalan walau gradle-build-release.log gak pernah dibuat
      # (release build gak pernah jalan sama sekali) -> artifact
      # 'log_fail_v*-release-*' ke-upload isi cuma bootstrap log + report cache,
      # MENYESATKAN (kelihatan kayak release build ikut gagal, padahal cuma
      # kena efek job failing dari debug). Fix: tambah syarat
      # `steps.build_release.outcome == 'failure'` — `outcome` step yang
      # di-SKIP nilainya `'skipped'` (bukan `'failure'`), jadi kondisi ini
      # cuma `true` kalau step "Build signed release APK" BENERAN dieksekusi
      # DAN beneran gagal. `failure()` di depan TETAP wajib dipertahankan
      # (tanpa itu, GitHub Actions otomatis nambahin `&& success()` implisit ke
      # `if:` manapun yang gak eksplisit pakai failure()/always() — bakal
      # bikin step ini malah gak jalan sama sekali pas release BENERAN gagal,
      # kasus yang justru paling penting buat fitur log_fail ini).
      - name: Upload failure log (release build)
        if: failure() && steps.build_release.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: log_fail_v${{ steps.version.outputs.name }}-release-run${{ github.run_number }}
          path: |
            gradle-wrapper-bootstrap.log
            gradle-build-release.log
            **/build/reports/**
          retention-days: 14
          if-no-files-found: warn

      # Batch 42: nama file APK sekarang ikut sertakan run ID unik (lihat rasional
      # lengkap di step "Publish GitHub Release" di bawah) — bukan cuma versi lagi.
      - name: Rename APK with dynamic version
        if: steps.secret_check.outputs.has_secret == 'true'
        id: rename
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/release/AudioEnhancerPro-v${{ steps.version.outputs.name }}-run${{ github.run_id }}-release.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      # Batch 26: body Release diambil dari entry CHANGELOG.md versi ini.
      # Batch 48: SEBELUMNYA seluruh entry (heading s.d. sebelum "## v" berikutnya)
      # didorong mentah2 ke body Release — entry CHANGELOG.md ditulis buat SESI
      # CLAUDE BERIKUTNYA (log teknis lengkap: root cause, bug yang ketemu &
      # diperbaiki, trade-off, dll), bukan buat pembaca umum di tab Releases GitHub
      # — hasilnya body Release jadi berhalaman-halaman, "berantakan" (keluhan
      # user eksplisit). SEKARANG: cuma ambil paragraf PEMBUKA entry (dari
      # pengamatan konsisten di 40+ entry terakhir: selalu "Diminta user..."/
      # deskripsi ringkas + daftar file disentuh, BARU disusul subsection detail
      # yang SELALU diawali baris "**...**") — berhenti di baris "**" PERTAMA,
      # dengan hard cap 15 baris apa pun formatnya (jaring pengaman kalau suatu
      # entry nanti gak ikut pola ini, body Release TETAP gak bisa membengkak).
      # Detail teknis penuh TETAP ada, cuma pindah jadi link ke CHANGELOG.md,
      # bukan hilang.
      # Batch 76: dulu cari header PERSIS `## v<versionName>` — MUSTAHIL berhasil
      # lagi sejak versionName otomatis dari GITHUB_RUN_NUMBER (nilainya beda
      # tiap run, Claude nulis CHANGELOG.md SEBELUM push jadi gak mungkin tahu
      # run_number run berikutnya duluan). Ganti total: ambil section PALING ATAS
      # CHANGELOG.md apa adanya (baris "## " pertama s.d. baris "## " kedua,
      # exclusive) — konsisten sama konvensi "entry terbaru paling atas" yang
      # MEMANG sudah dipakai file ini, 0 kebutuhan tahu versi/run_number lagi.
      - name: Extract changelog entry for this version
        if: steps.secret_check.outputs.has_secret == 'true'
        id: changelog
        run: |
          awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md > full_changelog_entry.md
          if [ -s full_changelog_entry.md ]; then
            awk '/^\*\*/{exit} NR>15{exit} {print}' full_changelog_entry.md > release_notes.md
            if [ ! -s release_notes.md ]; then
              head -n 8 full_changelog_entry.md > release_notes.md
            fi
            {
              echo ""
              echo "---"
              echo "_Ringkasan singkat. Rasional teknis lengkap: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)_"
            } >> release_notes.md
          else
            echo "_(CHANGELOG.md kosong/tidak ada entry — lihat riwayat commit)_" > release_notes.md
          fi

      # Batch 42 (diminta user, "tambahkan unique key ... mencegah duplikasi"):
      # `tag_name` SEKARANG selalu unik per run (`github.run_id` — dijamin GLOBAL
      # unik oleh GitHub, TIDAK PERNAH reset/reuse, beda dari `run_number` yang bisa
      # ambigu kalau ada "re-run" manual). SEBELUMNYA (Batch 11) tag sengaja
      # `v<versi>` polos & DIPAKAI ULANG kalau versionName sama dipush lagi (asset
      # di-overwrite) — keputusan itu SEKARANG DI-OVERRIDE SADAR sesuai permintaan
      # eksplisit user: setiap run bikin Release+tag BARU, TIDAK PERNAH nimpa/
      # tabrakan release run lain apapun skenarionya (push berulang tanpa bump versi,
      # retry, re-run job gagal, dst) — akar masalah "duplikasi" manapun yang
      # dilaporkan user (tag collision race, asset ketiban) LANGSUNG hilang karena
      # tiap run render live di key repository yang beda total, bukan lagi soal
      # timing siapa nulis duluan.
      # **Trade-off yang didisclose**: histori tab Releases sekarang numpuk 1 entry
      # PER RUN CI yang sukses (bukan 1 per versi lagi) — kalau user push 3x tanpa
      # ubah versionName, muncul 3 Release terpisah (v1.80.0-run111, -run222, -run333),
      # bukan 1 Release yang di-update. Judul Release tetap tampilkan nomor versi
      # DAN nomor run (`Run #<run_number>`, lebih pendek/gampang dibaca dari `run_id`
      # panjang) biar tetap jelas dari mana asalnya.
      - name: Publish GitHub Release
        if: steps.secret_check.outputs.has_secret == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-run${{ github.run_id }}
          name: AudioEnhancerPro v${{ steps.version.outputs.name }} (Run #${{ github.run_number }})
          files: ${{ steps.rename.outputs.path }}
          body_path: release_notes.md

      # Tetap disimpan juga sebagai Actions Artifact (retensi lebih pendek) buat
      # akses cepat dari histori run tanpa harus buka tab Releases. Nama artifact
      # ikut disertai run_id (Batch 42) — konsisten sama key unik di atas.
      - name: Upload signed release APK (artifact tambahan)
        if: steps.secret_check.outputs.has_secret == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AudioEnhancerPro-v${{ steps.version.outputs.name }}-run${{ github.run_id }}-release
          path: ${{ steps.rename.outputs.path }}
