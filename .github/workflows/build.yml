name: Build AudioEnhancerPro Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew

      # Ambil versionName langsung dari app/build.gradle.kts, jadi nama file/artifact
      # selalu ikut versi kode saat ini secara otomatis (dinamis, bukan ditulis manual).
      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then VERSION="0.0"; fi
          echo "Terdeteksi versionName: $VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 belum diset di GitHub Secrets. Build release dibatalkan."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Rename APK hasil build supaya nama file-nya sendiri sudah mengandung versi,
      # jadi jelas dari nama file saja tanpa perlu buka properties.
      - name: Rename APK with dynamic version
        id: rename
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/release/AudioEnhancerPro-v${{ steps.version.outputs.name }}-release.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      # Satu-satunya artifact yang di-upload: APK release yang sudah signed dan diberi nama versi.
      - name: Upload signed release APK (satu-satunya artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AudioEnhancerPro-v${{ steps.version.outputs.name }}-release
          path: ${{ steps.rename.outputs.path }}
