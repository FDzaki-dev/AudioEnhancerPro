name: Build AudioEnhancerPro Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Job ini SELALU jalan dan tidak butuh secret apapun — build debug murni buat
  # verifikasi cepat kalau kode-nya kompilasi dengan benar, independen dari status
  # keystore secrets.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v1.59 fix: dipindah ke PALING AWAL (sebelum step apapun yang bisa gagal) —
      # sebelumnya taruh SETELAH step wrapper, jadi kalau step wrapper gagal duluan,
      # step ini ikut ke-skip dan artifact log kegagalan jadi gak ada nomor versinya.
      # Cuma `grep` ke file teks, gak butuh gradlew/JDK sama sekali, aman dijalankan
      # paling depan.
      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then VERSION="0.0"; fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Batch 40 (pemangkasan waktu compile): GANTI TOTAL pendekatan lama
      # "Bootstrap Gradle Wrapper (isolated dir)" (generate wrapper via Gradle
      # sistem 9.6.1 di direktori scratch, baru dipakai buat jalanin ./gradlew —
      # 2 tahap, 2x kemungkinan download Gradle terpisah, TANPA cache sama sekali
      # antar-run). Action resmi ini provision Gradle 8.7 LANGSUNG (gak perlu
      # wrapper/gradlew apapun, cukup panggil `gradle` di PATH) DAN — ini yang
      # paling penting — otomatis cache distribusi Gradle + dependency (~/.gradle/
      # caches/modules-2) + Gradle Build Cache lokal ANTAR-RUN CI lewat GitHub
      # Actions cache backend. Run pertama sama seperti sebelumnya (download
      # semua), tapi run KEDUA dst kalau gradle.properties/build.gradle.kts gak
      # berubah: dependency di-restore dari cache dalam hitungan detik (bukan
      # download ulang ratusan MB AndroxX/Compose/Hilt tiap push), dan task
      # kapt/compileKotlin yang inputnya gak berubah di-restore dari Build Cache
      # (org.gradle.caching=true di gradle.properties), bukan dieksekusi ulang.
      # Ini win compile-time TERBESAR di batch ini.
      - name: Setup Gradle 8.7 (cached, no wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Output gradle di-tee ke file supaya bisa diupload sebagai artifact kalau gagal.
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --build-cache 2>&1 | tee gradle-build-debug.log

      # Diminta user: artifact 'log_fail_v*' biar gampang diunduh langsung kalau CI
      # gagal, tanpa perlu buka & scroll log mentah di tab Actions. Cuma jalan kalau
      # step build di atas gagal (if: failure()) — kalau sukses, gak ada artifact ini
      # sama sekali (gak numpuk artifact percuma tiap build sukses).
      - name: Upload failure log (debug build)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log_fail_v${{ steps.version.outputs.name }}-debug-run${{ github.run_number }}
          path: |
            gradle-build-debug.log
            **/build/reports/**
          retention-days: 14
          if-no-files-found: warn

  # Job ini CUMA build/publish beneran kalau KEYSTORE_BASE64 sudah diset di GitHub
  # Secrets (lihat step secret_check). Kalau belum, sebagian besar step di-skip
  # (bukan gagal).
  #
  # Batch 40: `needs: build` DICABUT — sebelumnya job ini SENGAJA nunggu job
  # `build` selesai duluan (sequential), sekarang jalan PARALEL bareng job `build`.
  # TRADE-OFF yang disadari & disengaja (waktu total, bukan gratis):
  #   (+) Waktu WALL-CLOCK CI total kepotong signifikan — sebelumnya total waktu =
  #       waktu(build) + waktu(release), sekarang = max(waktu(build), waktu(release))
  #       karena jalan bersamaan. ***Ini tujuan utama batch ini.***
  #   (-) Kalau kode BENERAN gak kompilasi (assembleDebug bakal gagal di job
  #       `build`), job `release` TETAP jalan assembleRelease sampai selesai/gagal
  #       sendiri (dulu: kalau job build gagal, release otomatis di-skip, hemat
  #       waktu). Repo ini PUBLIC (GitHub Actions minutes gratis/unlimited, dicatat
  #       eksplisit di PROJECT_STATE.md) — biaya cuma waktu, dan assembleRelease
  #       yang gagal juga cuma makan waktu paralel yang sama, bukan nambah durasi
  #       total run. Net: tetap lebih cepat, gak ada skenario yang jadi LEBIH LAMBAT
  #       dari sebelumnya.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then VERSION="0.0"; fi
          echo "Terdeteksi versionName: $VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Batch 40: sama seperti job `build` di atas — provision + cache Gradle 8.7
      # lewat action resmi, gak perlu bootstrap wrapper manual lagi.
      - name: Setup Gradle 8.7 (cached, no wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check keystore secret availability
        id: secret_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Salah satu/lebih dari 4 secrets keystore (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) belum diset lengkap di GitHub Secrets — job release di-skip (bukan gagal). Jalankan Kotak Perintah B (setup awal) untuk set keempat secrets sekaligus."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore from secret
        if: steps.secret_check.outputs.has_secret == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release APK
        if: steps.secret_check.outputs.has_secret == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --build-cache 2>&1 | tee gradle-build-release.log

      - name: Upload failure log (release build)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log_fail_v${{ steps.version.outputs.name }}-release-run${{ github.run_number }}
          path: |
            gradle-build-release.log
            **/build/reports/**
          retention-days: 14
          if-no-files-found: warn

      # Rename APK hasil build supaya nama file-nya sendiri sudah mengandung versi,
      # jadi jelas dari nama file saja tanpa perlu buka properties.
      - name: Rename APK with dynamic version
        if: steps.secret_check.outputs.has_secret == 'true'
        id: rename
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/release/AudioEnhancerPro-v${{ steps.version.outputs.name }}-release.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      # Body Release diambil LANGSUNG dari entry CHANGELOG.md versi ini (heading
      # "## v<versi> - <judul>" s.d. sebelum heading "## v" berikutnya).
      - name: Extract changelog entry for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          awk -v ver="## v${VERSION} " 'BEGIN{p=0} $0 ~ "^## v" && index($0, ver)==1 {p=1; next} p && /^## v/{p=0} p{print}' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "_(Tidak ada entry CHANGELOG.md untuk v${VERSION} — lihat riwayat commit)_" > release_notes.md
          fi

      # APK signed muncul langsung di sidebar beranda repo (bagian "Releases"),
      # bisa diunduh langsung tanpa buka Actions sama sekali dan tanpa terbungkus
      # .zip. Tag dipakai ulang (bukan re-create) kalau versionName sama persis
      # dipush lagi — asset APK-nya di-overwrite.
      - name: Publish GitHub Release
        if: steps.secret_check.outputs.has_secret == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: AudioEnhancerPro v${{ steps.version.outputs.name }}
          files: ${{ steps.rename.outputs.path }}
          body_path: release_notes.md

      # Tetap disimpan juga sebagai Actions Artifact (retensi lebih pendek) buat
      # akses cepat dari histori run tanpa harus buka tab Releases.
      - name: Upload signed release APK (artifact tambahan)
        if: steps.secret_check.outputs.has_secret == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AudioEnhancerPro-v${{ steps.version.outputs.name }}-release
          path: ${{ steps.rename.outputs.path }}
