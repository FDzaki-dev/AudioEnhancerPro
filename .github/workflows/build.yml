name: Build AudioEnhancerPro Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Job ini SELALU jalan dan tidak butuh secret apapun — build debug murni buat
  # verifikasi cepat kalau kode-nya kompilasi dengan benar, independen dari status
  # keystore secrets.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v1.59 fix: dipindah ke PALING AWAL (sebelum step apapun yang bisa gagal) —
      # sebelumnya taruh SETELAH step wrapper, jadi kalau step wrapper gagal duluan,
      # step ini ikut ke-skip dan artifact log kegagalan jadi gak ada nomor versinya
      # ('log_fail_v-debug-run64', bukan 'log_fail_v1.58-debug-run64' — persis yang
      # dilaporkan user). Cuma `grep` ke file teks, gak butuh gradlew/JDK sama sekali,
      # aman dijalankan paling depan.
      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then VERSION="0.0"; fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # v1.59 fix (v1.58 belum tuntas): `gradle wrapper` — MESKIPUN cuma buat generate
      # file wrapper — tetap trigger Gradle FASE KONFIGURASI PENUH project ini (baca
      # settings.gradle.kts + SEMUA build.gradle.kts termasuk ':app') pakai Gradle SISTEM
      # runner (9.6.1, gak kompatibel Kotlin Gradle Plugin 1.9.24 project ini). Jadi pin
      # versi di v1.58 ('gradle wrapper --gradle-version 8.7') TETAP gagal, cuma gagalnya
      # lebih awal (sebelum sempat generate wrapper-nya sendiri). Fix beneran: generate
      # wrapper di DIREKTORI KOSONG TERPISAH (file wrapper generik, TIDAK bergantung isi
      # project manapun — sama persis buat project apapun yang target Gradle-nya sama),
      # baru disalin ke repo. Dengan cara ini Gradle sistem 9.6.1 SAMA SEKALI TIDAK
      # PERNAH menyentuh build.gradle.kts project ini.
      - name: Bootstrap Gradle Wrapper (isolated dir)
        run: |
          set -o pipefail
          {
            if [ ! -f gradlew ]; then
              BOOTSTRAP_DIR=$(mktemp -d)
              # v1.60 fix (v1.59 belum tuntas): Gradle 9.6.1 ternyata BUKAN cuma nolak
              # evaluasi project asing (itu udah kefix di v1.59) — task 'wrapper'-nya
              # sendiri sekarang WAJIB direktori itu udah "valid Gradle project" (ada
              # file settings), kalau enggak langsung error "does not contain a Gradle
              # build" duluan sebelum sempat generate apa-apa. Fix: bikin
              # settings.gradle.kts KOSONG di direktori scratch ini dulu — cukup buat
              # bikin Gradle 9.6.1 mau jalan, TIDAK ada project asli yang dievaluasi
              # (file-nya kosong, gak ada subproject/dependency apapun di sini).
              echo "// scratch, cuma buat bootstrap wrapper generik" > "$BOOTSTRAP_DIR/settings.gradle.kts"
              ( cd "$BOOTSTRAP_DIR" && gradle wrapper --gradle-version 8.7 )
              cp "$BOOTSTRAP_DIR/gradlew" .
              cp "$BOOTSTRAP_DIR/gradlew.bat" .
              mkdir -p gradle/wrapper
              cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
              cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
              rm -rf "$BOOTSTRAP_DIR"
            fi
            chmod +x gradlew
          } 2>&1 | tee gradle-wrapper-bootstrap.log

      # Output gradle di-tee ke file supaya bisa diupload sebagai artifact kalau gagal
      # (sebelumnya cuma bisa dibaca dari tab Actions, harus buka run + scroll manual).
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build-debug.log

      # Diminta user: artifact 'log_fail_v*' biar gampang diunduh langsung kalau CI
      # gagal, tanpa perlu buka & scroll log mentah di tab Actions. Cuma jalan kalau
      # step build di atas gagal (if: failure()) — kalau sukses, gak ada artifact ini
      # sama sekali (gak numpuk artifact percuma tiap build sukses).
      - name: Upload failure log (debug build)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log_fail_v${{ steps.version.outputs.name }}-debug-run${{ github.run_number }}
          path: |
            gradle-wrapper-bootstrap.log
            gradle-build-debug.log
            **/build/reports/**
          retention-days: 14
          if-no-files-found: warn

  # Job ini CUMA jalan kalau KEYSTORE_BASE64 sudah diset di GitHub Secrets.
  # Kalau belum, job ini di-skip (bukan gagal) — supaya CI tidak menampilkan ❌
  # menyesatkan cuma karena secrets belum disiapkan.
  release:
    needs: build
    runs-on: ubuntu-latest
    # Batch 11 fix: WAJIB buat publish GitHub Release (bukan cuma Actions Artifact) —
    # softprops/action-gh-release butuh izin tulis ke repo (bikin release + upload asset).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v1.59 fix: dipindah ke PALING AWAL + jadi UNCONDITIONAL (sebelumnya cuma jalan
      # kalau has_secret==true, dan taruh SETELAH step wrapper). Sekarang dibutuhkan
      # buat penamaan artifact log kegagalan juga (bukan cuma nama rilis), jadi harus
      # selalu ada nilainya sedini mungkin, apapun yang terjadi di step-step berikutnya.
      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then VERSION="0.0"; fi
          echo "Terdeteksi versionName: $VERSION"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # v1.59 fix: sama seperti job build — generate wrapper di direktori kosong
      # terpisah, jangan langsung di root project (lihat komentar lengkap di job build).
      - name: Bootstrap Gradle Wrapper (isolated dir)
        run: |
          set -o pipefail
          {
            if [ ! -f gradlew ]; then
              BOOTSTRAP_DIR=$(mktemp -d)
              # v1.60 fix (v1.59 belum tuntas): Gradle 9.6.1 ternyata BUKAN cuma nolak
              # evaluasi project asing (itu udah kefix di v1.59) — task 'wrapper'-nya
              # sendiri sekarang WAJIB direktori itu udah "valid Gradle project" (ada
              # file settings), kalau enggak langsung error "does not contain a Gradle
              # build" duluan sebelum sempat generate apa-apa. Fix: bikin
              # settings.gradle.kts KOSONG di direktori scratch ini dulu — cukup buat
              # bikin Gradle 9.6.1 mau jalan, TIDAK ada project asli yang dievaluasi
              # (file-nya kosong, gak ada subproject/dependency apapun di sini).
              echo "// scratch, cuma buat bootstrap wrapper generik" > "$BOOTSTRAP_DIR/settings.gradle.kts"
              ( cd "$BOOTSTRAP_DIR" && gradle wrapper --gradle-version 8.7 )
              cp "$BOOTSTRAP_DIR/gradlew" .
              cp "$BOOTSTRAP_DIR/gradlew.bat" .
              mkdir -p gradle/wrapper
              cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
              cp "$BOOTSTRAP_DIR/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
              rm -rf "$BOOTSTRAP_DIR"
            fi
            chmod +x gradlew
          } 2>&1 | tee gradle-wrapper-bootstrap.log

      - name: Check keystore secret availability
        id: secret_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Salah satu/lebih dari 4 secrets keystore (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) belum diset lengkap di GitHub Secrets — job release di-skip (bukan gagal). Jalankan Kotak Perintah B (setup awal) untuk set keempat secrets sekaligus."
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore from secret
        if: steps.secret_check.outputs.has_secret == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release APK
        if: steps.secret_check.outputs.has_secret == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-build-release.log

      # v1.59 fix: SEBELUMNYA kondisi ini juga cek 'has_secret == true' — tapi kalau
      # step bootstrap wrapper gagal DULUAN (sebelum step secret_check sempat jalan),
      # output 'has_secret' kosong dan artifact log GAGAL ke-upload padahal build-nya
      # beneran gagal. Sekarang cukup 'if: failure()' saja, konsisten dengan job build.
      - name: Upload failure log (release build)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log_fail_v${{ steps.version.outputs.name }}-release-run${{ github.run_number }}
          path: |
            gradle-wrapper-bootstrap.log
            gradle-build-release.log
            **/build/reports/**
          retention-days: 14
          if-no-files-found: warn

      # Rename APK hasil build supaya nama file-nya sendiri sudah mengandung versi,
      # jadi jelas dari nama file saja tanpa perlu buka properties.
      - name: Rename APK with dynamic version
        if: steps.secret_check.outputs.has_secret == 'true'
        id: rename
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          DEST="app/build/outputs/apk/release/AudioEnhancerPro-v${{ steps.version.outputs.name }}-release.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      # Batch 11 fix: SEBELUMNYA cuma upload-artifact (ketebak/tersembunyi di tab
      # Actions, kadaluarsa otomatis, gak muncul di sidebar repo). Sekarang publish
      # sebagai GitHub Release beneran — APK signed muncul langsung di sidebar
      # beranda repo (bagian "Releases"), bisa diunduh langsung tanpa buka Actions
      # sama sekali dan tanpa terbungkus .zip. Tag dipakai ulang (bukan re-create)
      # kalau versionName sama persis dipush lagi — asset APK-nya di-overwrite.
      - name: Publish GitHub Release
        if: steps.secret_check.outputs.has_secret == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: AudioEnhancerPro v${{ steps.version.outputs.name }}
          files: ${{ steps.rename.outputs.path }}
          generate_release_notes: true

      # Tetap disimpan juga sebagai Actions Artifact (retensi lebih pendek) buat
      # akses cepat dari histori run tanpa harus buka tab Releases.
      - name: Upload signed release APK (artifact tambahan)
        if: steps.secret_check.outputs.has_secret == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AudioEnhancerPro-v${{ steps.version.outputs.name }}-release
          path: ${{ steps.rename.outputs.path }}
